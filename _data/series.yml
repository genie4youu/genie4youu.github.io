# 홈 랜딩(_layouts/landing.html)의 시리즈 카드 데이터. 시리즈의 단일 정본이다.
#
# 편수는 여기 적지 않는다. landing.html 이 _posts/<dir>/ 안의 글을 직접 센다.
# 손으로 적으면 글이 늘 때마다 조용히 낡는다.
#
# id           : 카드 강조색 키. assets/css/jekyll-theme-chirpy.scss 의 $series-* 와 이름이 같아야 한다.
# name         : 카드에 보이는 연재 이름. _tabs/series.md 의 절 제목, 그리고 00 목차 글의
#                제목 "00. <name> — 시리즈 목차" 와 같은 말이어야 한다. (tools/lint-site.mjs 검사 8)
# dirs         : _posts/ 아래 폴더 이름. 편수를 세는 기준이다.
# index        : 카드를 눌렀을 때 갈 곳. 시리즈 목차 글을 쓴다.
# category     : index 가 없을 때 /categories/<category>/ 로 대신 보낸다. 링크 대상이다.
# top_category : 이 연재 글들이 실제로 쓰는 categories 의 첫 칸(대분류). 링크가 아니라 대응 기록이다.
#                🔴 name 과 다를 수 있고, 다른 것이 정상이다 — 아래 "이름이 왜 다른가" 참고.
# resume_note  : _tabs/resume.md 의 블로그 표에 들어갈 한 줄. 그 표는 이 파일을 순회해 만든다.
#
# ── 이름이 왜 다른가 (2026-08-25 확정) ──────────────────────────────
# 대분류(top_category)는 "주제 영역", name 은 "연재 제목"이라 역할이 다르다.
#   ADRC(연재)는 제어 이론(주제) 아래 있고, 앞으로 다른 제어 연재가 같은 칸에 들어온다.
#   Stateflow 는 카드가 둘(stateflow / sflayout)인데 주제는 하나다.
# 그래서 5건이 일부러 다르다. 맞추려 하지 말고 top_category 로 대응만 고정한다.
#
# ⚠️ 카드는 landing.html 에서 항상 <a href> 로 감싸인다. index 도 category 도 없으면
#    href="" 가 되고, index 가 없는 글을 가리키면 internal-link 실패가 된다.
#    둘 중 하나는 실제로 존재하는 대상이어야 한다. (2026-08-07 빌드 실패로 확인)

