# 태그 어휘 사전 (2026-08-24 신설)
#
# 이 파일은 렌더에 쓰이지 않는다. 글을 쓸 때 참고하는 문서다.
# Jekyll 이 읽어도 아무 일도 안 일어난다. 사람이 읽으라고 _data 에 둔다.
#
# ── 왜 필요했나 ──────────────────────────────────────────────
# 2026-08-24 실측: 포스트 294편에 태그 사용 1685회, 고유 표기 745개.
# 그중 535개(71.4%)가 1편에서만 쓰였고 642개(85.7%)가 2편 이하다.
# 포스트당 개수는 평균 5.73개로 균일하다.
#
# 즉 문제는 개수가 아니라 어휘 통제가 없다는 것이다. 매 글이 그때그때
# 새 말을 지어내서 /tags/ 페이지가 목록으로서 기능하지 않는다.
#
# ── 원칙 ─────────────────────────────────────────────────────
# 1. 태그는 카테고리를 가로지르는 축이다.
#    한 카테고리 안에만 있는 이름은 태그로 두지 않는다. 그건 카테고리가 이미 한다.
#    예) 'ADRC 설계' 안에서만 쓰이는 말은 태그가 아니다.
#
# 2. 소문자로 쓴다.
#    Jekyll 이 슬러그로 접을 때 대소문자를 무시하므로 EtherCAT 과 ethercat 이
#    한 페이지가 되고 어느 표기가 이기는지 불안정해진다.
#    tools/lint-site.mjs 의 [1] 검사가 이걸 잡는다.
#
# 3. 한 글에 4~7개.
#    지금 평균이 5.73 이고 이 정도가 적당하다. 더 붙인다고 더 찾아지지 않는다.
#
# 4. 아래 목록에 있는 말을 먼저 찾아 쓴다.
#    없으면 새로 만들되, 그 말이 두 번째 글에서도 쓰일 것 같은지 먼저 생각한다.
#    한 번만 쓸 말이면 안 붙이는 편이 낫다.
#
# ── 지금 상태에 대해 ─────────────────────────────────────────
# 🔴 기존 535개의 1회용 태그를 일괄 정리하지 않았다.
#    기계적으로 합치면 의미가 뭉개진다. 어느 것이 같은 뜻인지는 글을 읽어야 알고,
#    그건 사람이 판단할 일이다. 아래 목록은 새로 쓸 때의 기준이고,
#    과거분 정리는 별도 결정으로 남긴다.
#
# ── 정본 어휘 ────────────────────────────────────────────────
# 실측 기준: 2026-08-24 에 3편 이상에서 쓰인 표기.
# 숫자는 그때의 사용 편수이고 갱신하지 않는다. 순위가 아니라 이 말이
# 실제로 여러 글을 가로질렀다는 증거로만 쓴다.

