# 홈 랜딩(_layouts/landing.html)의 시리즈 카드 데이터.
#
# 편수는 여기 적지 않는다. landing.html 이 _posts/<dir>/ 안의 글을 직접 센다.
# 손으로 적으면 글이 늘 때마다 조용히 낡는다.
#
# id     : 카드 강조색 키. assets/css/jekyll-theme-chirpy.scss 의 $series-rails-* 와 이름이 같아야 한다.
# dirs   : _posts/ 아래 폴더 이름. 편수를 세는 기준이다.
# index  : 카드를 눌렀을 때 갈 곳. 시리즈 목차 글을 쓴다.
# category: index 가 없을 때 /categories/<카테고리>/ 로 대신 보낸다.

- id: stateflow
  name: Stateflow
  icon: fa-solid fa-diagram-project
  dirs: [stateflow]
  index: /posts/00-stateflow-series/
  blurb: Chart 만들기부터 실행 순서, 설계, 관측, 검증, 자동화까지. 배터리 충전 제어를 하나의 예제로 이어서 쓴다.

- id: adrc
  name: ADRC
  icon: fa-solid fa-wave-square
  dirs: [adrc]
  index: /posts/00-adrc-series/
  blurb: 정확한 모델 없이 외란을 추정해 상쇄하는 제어 기법. 발상에서 출발해 이산화, 튜닝, 수식 유도까지 내려간다.

- id: amr
  name: 실내 배송 AMR
  icon: fa-solid fa-robot
  dirs: [amr]
  index: /posts/00-amr-series/
  blurb: MATLAB, Simulink, Stateflow 만으로 만든 프로젝트. 좌표계에서 시작해 SLAM, 경로계획, 감독제어, 검증까지 이어진다.
  repo: https://github.com/genie4youu/amr_robot_planning

- id: mcp
  name: MCP와 MATLAB 연결
  icon: fa-solid fa-plug
  dirs: [mcp]
  index: /posts/00-mcp-series/
  blurb: AI 에이전트를 MATLAB 에 붙이는 프로토콜과 실무 설정. JSON-RPC, 보안 모델, 승인 모드를 정리했다.

- id: sflayout
  name: Stateflow 레이아웃 자동화
  # ⚠️ fa-vector-square 는 Font Awesome 7 에서 빠졌다. 테마가 FA7 을 불러오므로 쓰면 아이콘 자리가 빈다.
  #    아이콘을 바꿀 때는 FA7 free 에 있는지 확인한다.
  icon: fa-solid fa-object-group
  dirs: [sflayout]
  index: /posts/00-sflayout-series/
  blurb: State 37개, Transition 67개짜리 차트를 사람이 읽을 수 있게 만든 기록. 그래픽 위반 32건을 0으로 줄였다.

- id: comm
  name: 로봇 통신
  icon: fa-solid fa-network-wired
  # 통신 하나 = 폴더 하나로 나눠 두었다. 카드는 하나지만 편수는 일곱 폴더를 합쳐 센다.
  dirs: [comm-basics, comm-spi-i2c, comm-serial, comm-can, comm-ethernet, comm-ethercat, comm-summary]
  index: /posts/00-comm-series/
  blurb: 도달, 동기, 경계, 무결, 조정, 시간. 여섯 칸을 정해 두고 SPI 부터 EtherCAT 까지 같은 표를 채워 나간다.

- id: rtos
  name: RTOS와 실시간
  icon: fa-solid fa-stopwatch
  # 이론 / 리눅스 / 윈도우로 나눠 두었다. 카드는 하나지만 편수는 세 폴더를 합쳐 센다.
  dirs: [rtos-theory, rtos-linux, rtos-windows]
  index: /posts/00-rtos-series/
  blurb: 실시간은 빠른 게 아니라 늦지 않는 것이다. 스케줄 가능성을 손으로 계산하고, 리눅스와 윈도우에서 실제로 재본다.

# ⚠️ 카드는 landing.html 에서 항상 <a href> 로 감싸인다. index 도 category 도 없으면
#    href="" 가 되고, index 가 없는 글을 가리키면 internal-link 실패가 된다.
#    둘 중 하나는 실제로 존재하는 대상이어야 한다. (2026-08-07 빌드 실패로 확인)
- id: mp
  name: MATLAB과 Simulink 문법
  icon: fa-solid fa-calculator
  dirs: [matlab, simulink, stateflow-syntax]
  index: /posts/00-mp-series/
  blurb: 남이 만든 모델을 읽기 위한 최소 문법. 정수 타입과 비트 연산에서 시작해 블록과 Stateflow 문법까지.

- id: reading
  name: 업계 읽기
  icon: fa-solid fa-newspaper
  dirs: [news, papers, trends]
  category: 업계 읽기
  blurb: 로보틱스 뉴스, 논문 한 편 상세 리딩, 주간 기술 동향.

- id: break
  name: 쉬어가기
  icon: fa-solid fa-mug-hot
  dirs: [etc]
  index: /posts/00-office-rpg-series/
  blurb: 공부 글이 아닌 읽을거리.
